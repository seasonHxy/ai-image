services:
  ai-image:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ai-image-data:/app/data
    environment:
      - ADMIN_KEY=${ADMIN_KEY:-change-me-to-a-strong-random-string}
      - SITE_URL=${SITE_URL:-http://localhost:3000}
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    restart: unless-stopped

volumes:
  ai-image-data:
